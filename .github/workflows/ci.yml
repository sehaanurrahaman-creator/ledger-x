name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + build + test + demo (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # One command, and it decides the verdict: the style lint (including the self-test of its
      # own two ADR rules), javac --release 21 -Xlint:all -Werror, the substrate contract test
      # and the domain model's property suite. It publishes both verdicts as run annotations.
      - name: Build and test
        run: ./build.sh

      # ADR 0004's evidence: sweep every byte offset of twelve random histories as a crash
      # point — crash, recover, hash — and demand checkpoint + tail, full replay from scratch,
      # and crash-recover-continue all land on the clean run's exact bytes.
      - name: Checkpoint replay harness
        run: make replay

      # The domain ticket's deliverable, run as a human would run it. The demo asserts what it
      # prints — Σ balances = 0, the index equal to a fold of the log, a refused transaction
      # that changed nothing — and exits non-zero if any of it is untrue.
      - name: Demo
        run: make demo

      # ADR 0003's evidence: fork a durable ledger, SIGKILL it at a random instant, recover, and
      # compare the log against what was acknowledged. 1,000 cycles across the fsync menu and both
      # crash models; the step publishes its per-policy table into the job summary.
      - name: Kill -9 micro-harness
        run: make crash

      # The same properties at ~10x the operations, ~20s. Timing data for the map's CI-budget
      # fog: this step is the expensive one and it is still cheap.
      - name: Extended property campaign
        run: make campaign
